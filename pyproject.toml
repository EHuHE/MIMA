[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mima-apn-sbox"
version = "1.0.0"
description = "Reproducible verification tools and retained low-latency candidates for a fixed 6-bit APN S-box"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "EHuHE" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
mima-verify = "mima_verify.cli:verify_main"
mima-replay-recipe = "mima_verify.cli:replay_main"
mima-release-audit = "mima_verify.cli:audit_main"
mima-simulate = "mima_verify.cli:simulate_main"
mima-search-cse = "mima_verify.cli:search_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mima_verify*"]

[tool.ruff]
line-length = 100
target-version = "py310"
