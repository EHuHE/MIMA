name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify retained candidates
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            s100_apl_94432cbb162fe56d \
            s100_apl_29fd2ff6b6c1dffd \
            s100_y1x4_3f8b9fd2cfc1e3ff \
            s100_cse27_3f9b3b31517bfce2
          do
            mima-verify "candidates/${candidate}/theory.json"
          done
      - name: Replay retained recipes
        run: |
          mima-replay-recipe candidates/s100_apl_94432cbb162fe56d candidates/s100_apl_29fd2ff6b6c1dffd
          mima-replay-recipe candidates/s100_y1x4_3f8b9fd2cfc1e3ff candidates/s100_cse27_3f9b3b31517bfce2
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
      - name: Exhaustive VHDL simulation
        run: |
          mima-simulate candidates/s100_apl_29fd2ff6b6c1dffd/SB.vhd
          mima-simulate candidates/s100_cse27_3f9b3b31517bfce2/SB.vhd
      - name: Release audit
        run: mima-release-audit --root .
